      quote: 'APA may disclose personal information to overseas recipients in order to provide its services and for administrative or other business management purposes, including to cloud service providers for data storage purposes.'
    - source: https://www.apa.com.au/privacy-statement/
      http_status: 200
      fetched: '2026-10-21'
