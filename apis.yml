name: APA Group

description: APA Group is an Australian Securities Exchange (ASX) listed energy infrastructure business that owns and operates a portfolio of more than $20 billion in assets. It delivers around half of Australia's domestic gas through a 15,000-kilometre network of gas pipelines, alongside gas transmission, processing, compression and storage assets, and generates electricity from gas-powered and renewable assets while owning and operating battery storage and electricity transmission infrastructure. APA does not publish a public developer portal or API documentation on apa.com.au; it was surfaced via the australia-apidays-2026 harvest.

